<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>scnu课程表 · 没课像素动画预览（16 帧）</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#E8E6E1;color:#26241f;padding:28px 20px 60px}
  .proto-badge{display:inline-block;background:#26241f;color:#fff;font-size:11px;padding:3px 10px;border-radius:999px;letter-spacing:.5px}
  h1{font-size:22px;margin:10px 0 4px}
  .sub{font-size:13px;color:#6f6b63;margin-bottom:20px;line-height:1.6;max-width:900px}

  .tbtnrow{display:flex;gap:8px;margin-bottom:16px}
  .tbtn{border:1px solid #bbb;background:#fff;color:#333;padding:7px 16px;border-radius:10px;cursor:pointer;font-size:13px}
  .tbtn.active{background:#26241f;color:#fff;border-color:#26241f}

  .stage{display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start}
  .player{background:#fff;border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
  .player h2{font-size:15px;margin-bottom:12px}
  canvas#main{border-radius:12px;display:block;image-rendering:pixelated}
  .controls{display:flex;gap:10px;align-items:center;margin-top:12px}
  .controls button{border:1px solid #bbb;background:#fff;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px}
  .controls label{font-size:12px;color:#666}
  .controls input[type=range]{width:120px}
  .frameinfo{font-size:12px;color:#888;margin-left:4px}

  .frames{background:#fff;border-radius:16px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
  .frames h2{font-size:15px;margin-bottom:12px}
  .grid{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;max-width:560px}
  .grid canvas{width:100%;border:1px solid #eee;border-radius:4px;image-rendering:pixelated;display:block}
  .grid div{font-size:9px;color:#aaa;text-align:center;margin-top:2px}

  .note{max-width:900px;font-size:12px;color:#6f6b63;line-height:1.7;margin-top:24px}
</style>
</head>
<body data-theme="cream">

<span class="proto-badge">PROTOTYPE · 原型预览</span>
<h1>没课像素动画 · 冒烟咖啡杯（16 帧循环）</h1>
<div class="sub">给桌面小组件空态设计的 16 帧像素动画：没课的时候，小组件里显示一杯冒着热气的咖啡。像素画 16x16 网格，可播放/暂停、调速度、单帧查看；背景随三套主题切换。</div>

<div class="tbtnrow">
  <button class="tbtn active" id="tb-cream" onclick="setTheme('cream')">奶油珊瑚</button>
  <button class="tbtn" id="tb-night" onclick="setTheme('night')">午夜机房</button>
  <button class="tbtn" id="tb-paper" onclick="setTheme('paper')">老报刊亭</button>
</div>

<div class="stage">
  <div class="player">
    <h2>动画播放</h2>
    <canvas id="main" width="320" height="320"></canvas>
    <div class="controls">
      <button id="btnPlay" onclick="toggle()">暂停</button>
      <button onclick="speed(1)">快</button>
      <button onclick="speed(0.5)">慢</button>
      <label>帧 <input type="range" id="frameSlider" min="0" max="15" value="0" oninput="seek(this.value)"><span class="frameinfo" id="frameInfo">0/15</span></label>
    </div>
  </div>
  <div class="frames">
    <h2>16 帧序列</h2>
    <div class="grid" id="frameGrid"></div>
  </div>
</div>

<div class="note">
  选定后落地到 App：小组件（Glance）与 App 空态页都可以复用这组像素帧（生成 16 帧位图数组或 drawable）。帧率建议 8fps（125ms/帧）。需要调整冒烟速度、咖啡杯配色或换成别的图形（书本、月亮、小太阳等）随时说。
</div>

<script>
  var THEMES = {
    cream:  {bg:['#FAF9F5','#F0E8DC'], smoke:'#C9BEB0'},
    night:  {bg:['#201D1D','#262326'], smoke:'#4E4C49'},
    paper:  {bg:['#F0E8D6','#E4D8BC'], smoke:'#B9AC93'}
  };

  // ---------- 16x16 像素画：咖啡杯 + 冒烟（16 帧） ----------
  // 颜色
  var C = { body:'#8B5A3C', bodyHi:'#A57250', rim:'#6B4228', liquid:'#6B3F24', handle:'#7A4E33' };

  function isCup(x, y){
    // 杯身 (4..11, 8..13)，杯口 (3..12, 7)，液体 (5..10, 8)，杯把右侧 (12..13, 10..11)
    if (y === 7 && x >= 3 && x <= 12) return 'rim';
    if (y === 8 && x >= 5 && x <= 10) return 'liquid';
    if (y >= 8 && y <= 13 && x >= 4 && x <= 11) return y === 8 ? 'bodyHi' : 'body';
    if (y >= 10 && y <= 11 && x >= 12 && x <= 13) return 'handle';
    return null;
  }

  // 烟粒子：phase 0..15（从杯口升到顶消散）
  function smokePixel(phase, x){
    // 两股烟，错开 8 帧
    var p1 = phase;
    var p2 = (phase + 8) % 16;
    function one(p, baseX){
      if (p === 0) return null;         // 帧0 在杯口内（未冒出）
      var y = 7 - Math.floor(p * 6 / 15); // 7 -> 1
      var wob = Math.round(Math.sin(p * 0.5) * 0.6);
      var px = baseX + wob;
      if (x === px && y >= 1 && y <= 6) return p >= 13 ? 0.25 : (p >= 9 ? 0.5 : 0.85); // 越往上越淡
      return null;
    }
    var a1 = one(p1, 6), a2 = one(p2, 9);
    return a1 || a2 || null;
  }

  function drawFrame(ctx, f, scale, theme){
    ctx.fillStyle = THEMES[theme].bg[0];
    ctx.fillRect(0, 0, 16*scale, 16*scale);
    // 底部淡色渐变带
    ctx.fillStyle = THEMES[theme].bg[1];
    ctx.fillRect(0, 14*scale, 16*scale, 2*scale);
    for (var y = 0; y < 16; y++){
      for (var x = 0; x < 16; x++){
        var cup = isCup(x, y);
        if (cup){
          ctx.fillStyle = C[cup];
          ctx.fillRect(x*scale, y*scale, scale, scale);
          continue;
        }
        var a = smokePixel(f, x);
        if (a){
          ctx.globalAlpha = a;
          ctx.fillStyle = THEMES[theme].smoke;
          ctx.fillRect(x*scale, y*scale, scale, scale);
          ctx.globalAlpha = 1;
        }
      }
    }
  }

  var main = document.getElementById('main');
  var mctx = main.getContext('2d');
  var slider = document.getElementById('frameSlider');
  var frameInfo = document.getElementById('frameInfo');

  var frame = 0, playing = true, rate = 125;
  var timer = setInterval(tick, rate);

  function tick(){
    if (!playing) return;
    frame = (frame + 1) % 16;
    render();
  }
  function render(){
    drawFrame(mctx, frame, 20, document.body.dataset.theme);
    slider.value = frame;
    frameInfo.textContent = frame + '/15';
    paintGrid();
  }
  function toggle(){
    playing = !playing;
    document.getElementById('btnPlay').textContent = playing ? '暂停' : '播放';
  }
  function speed(m){ clearInterval(timer); timer = setInterval(tick, Math.round(rate * m)); }
  function seek(v){ frame = parseInt(v); render(); }

  // 16 帧平铺
  var grid = document.getElementById('frameGrid');
  var cvs = [];
  for (var i = 0; i < 16; i++){
    var cell = document.createElement('div');
    var cv = document.createElement('canvas');
    cv.width = 48; cv.height = 48;
    cell.appendChild(cv);
    var lab = document.createElement('div');
    lab.textContent = i;
    cell.appendChild(lab);
    grid.appendChild(cell);
    cvs.push(cv);
  }
  function paintGrid(){
    for (var i = 0; i < 16; i++){
      var c = cvs[i].getContext('2d');
      drawFrame(c, i, 3, document.body.dataset.theme);
    }
  }

  function setTheme(t){
    document.body.dataset.theme = t;
    ['cream','night','paper'].forEach(function(k){ document.getElementById('tb-'+k).classList.toggle('active', k === t); });
    render();
  }

  render();
</script>
</body>
</html>
